<title>Templar Open World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* One screen: the world fills the window; a slim header, a place card and a compass. Single dark look, like the game. */
:root { --panel: rgba(16, 14, 13, 0.82); --line: rgba(232, 214, 180, 0.16); --fg: #ece2cf; --dim: #a99d88; --accent: #c0281e; --gold: #c9a24a; color-scheme: dark; }
html, body { height: 100%; }
body { margin: 0; background: #0e0d0c; color: var(--fg); font: 15px/1.45 'Alegreya Sans', 'Gill Sans', 'Trebuchet MS', sans-serif; overflow: hidden; }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
header { position: fixed; top: env(safe-area-inset-top, 0px); left: 0; right: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 12px 16px; background: linear-gradient(rgba(16, 14, 13, 0.75), rgba(16, 14, 13, 0)); pointer-events: none; }
header > * { pointer-events: auto; }
h1 { margin: 0; font: 400 24px/1 'IM Fell English SC', Georgia, serif; }
h1 span { color: var(--accent); }
.row { display: flex; flex-wrap: wrap; gap: 6px; }
button { font: 500 14px 'Alegreya Sans', sans-serif; color: var(--fg); background: rgba(20, 18, 16, 0.85); border: 1px solid var(--line); border-radius: 4px; padding: 6px 12px; cursor: pointer; }
button:hover { border-color: rgba(232, 214, 180, 0.4); }
button[aria-pressed="true"] { border-color: var(--gold); background: rgba(70, 52, 22, 0.85); }
#card { position: fixed; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: min(360px, calc(100% - 32px)); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px 16px; display: grid; gap: 6px; }
#card .sub { color: var(--gold); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; }
#card h2 { margin: 0; font: 400 26px/1.05 'IM Fell English SC', Georgia, serif; }
#card p { margin: 0; color: var(--dim); }
#hint { font-size: 13px; color: var(--dim); }
#compass { position: fixed; top: calc(60px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); width: min(420px, 70vw); height: 40px; overflow: hidden; border-bottom: 1px solid var(--line); font: 400 15px 'IM Fell English SC', Georgia, serif; color: var(--fg); pointer-events: none; mask-image: linear-gradient(90deg, transparent, #000 25%, #000 75%, transparent); -webkit-mask-image: linear-gradient(90deg, transparent, #000 25%, #000 75%, transparent); }
#compass div { position: absolute; top: 2px; transform: translateX(-50%); white-space: nowrap; }
#compass .poi { color: var(--gold); font-size: 13px; top: 20px; }
#map { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: 180px; height: 180px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
#fwd { position: fixed; right: 16px; bottom: calc(210px + env(safe-area-inset-bottom, 0px)); width: 72px; height: 72px; border-radius: 50%; display: none; }
#fwd.on { display: block; }
#card.min p, #card.min #hint { display: none; }
#load[hidden] { display: none; }
#load { position: fixed; inset: 0; display: grid; place-items: center; font: 400 22px 'IM Fell English SC', Georgia, serif; color: var(--dim); background: #0e0d0c; }
@media (max-width: 640px) { h1 { font-size: 20px; } #map { width: 120px; height: 120px; } #fwd { bottom: calc(150px + env(safe-area-inset-bottom, 0px)); } #compass { top: calc(96px + env(safe-area-inset-top, 0px)); } }
</style>
<canvas id="c" aria-label="Explorable world"></canvas>
<header>
  <h1>Templar <span>open world</span></h1>
  <div class="row">
    <button id="mWalk" type="button" aria-pressed="true">Walk</button>
    <button id="mFly" type="button" aria-pressed="false">Fly over</button>
    <button id="mMin" type="button" aria-pressed="false">Hide notes</button>
  </div>
  <div class="row" id="go" aria-label="Travel to"></div>
</header>
<div id="compass" aria-hidden="true"></div>
<section id="card">
  <div class="sub" id="sub"></div>
  <h2 id="name"></h2>
  <p id="desc"></p>
  <div id="hint"></div>
</section>
<canvas id="map" width="360" height="360" aria-label="Map"></canvas>
<button id="fwd" type="button" aria-label="Walk forward">Walk</button>
<div id="load">Raising the Reach of Saint Ansgar…</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(async () => {
  'use strict';
  const ASSETS = /*__ASSETS__*/null;      // CC0 textures and Kenney props, inlined by build.py
  const lap = () => {};
  const PI = Math.PI, $ = id => document.getElementById(id);
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x)), lerp = (a, b, t) => a + (b - a) * t, sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  let seed = 11;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  const rr = (a, b) => a + (b - a) * rnd(), pick3 = a => a[Math.floor(rnd() * a.length)];
  const hash = (x, y) => { let h = (x * 374761393 + y * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177 | 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967295; };
  function noise(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    return lerp(lerp(hash(xi, yi), hash(xi + 1, yi), u), lerp(hash(xi, yi + 1), hash(xi + 1, yi + 1), u), v) * 2 - 1;
  }
  const fbm = (x, y, o = 5) => { let s = 0, a = 0.5, f = 1; for (let i = 0; i < o; i++) { s += a * noise(x * f, y * f); f *= 2.03; a *= 0.5; } return s; };
  const ridged = (x, y, o = 5) => { let s = 0, a = 0.5, f = 1; for (let i = 0; i < o; i++) { s += a * (1 - Math.abs(noise(x * f, y * f))); f *= 2.03; a *= 0.5; } return s; };
  const C = h => new THREE.Color(h), CL = h => new THREE.Color(h).convertSRGBToLinear(), V = (x, y, z) => new THREE.Vector3(x, y, z);

  // ================================================================ the region
  // 1.6 km square, north is -Z. Shrine highlands in the south (the monastery hub), the siege front across the middle along a broken
  // fortress line, the dead hive city in the north. A pilgrim road runs from the hub's gate through the front into the hive.
  const SIZE = 1600, HALF = SIZE / 2;
  const HUB = V(20, 0, 560), GATE_Z = 498;
  const ROAD = [[20, 500], [10, 430], [-40, 360], [-30, 280], [30, 200], [50, 120], [20, 40], [0, -20], [-30, -90], [-60, -170], [-40, -250], [10, -330], [30, -420], [0, -520], [-20, -640], [0, -800]];
  // zone weights from a noise-warped north-south coordinate: 1 = shrine, 0 = siege, -1 = hive
  function zones(x, z) {
    const zw = z + fbm(x * 0.004 + 9, z * 0.004) * 110;
    const s = sstep(110, 260, zw), h = sstep(110, 260, -zw); return [s, 1 - s - h, h];
  }
  // distance to the road polyline, and how far along it
  function roadD(x, z) {
    let best = 1e9;
    for (let i = 0; i < ROAD.length - 1; i++) {
      const [ax, az] = ROAD[i], [bx, bz] = ROAD[i + 1], dx = bx - ax, dz = bz - az, t = clamp(((x - ax) * dx + (z - az) * dz) / (dx * dx + dz * dz), 0, 1);
      const d = Math.hypot(x - ax - dx * t, z - az - dz * t); if (d < best) best = d;
    }
    return best;
  }
  // craters (siege band, a few in the hive) and zig-zag trench lines along the front
  seed = 5;
  const CRATERS = [];
  for (let i = 0; i < 700; i++) { const x = rr(-HALF, HALF), z = rr(-330, 260); CRATERS.push([x, z, 2.5 + rnd() ** 2.2 * 13]); }
  const TRENCH = [];
  for (const [z0, x0, x1] of [[150, -700, 700], [95, -650, 600], [-60, -700, 700], [-120, -600, 680]]) {
    const line = []; for (let x = x0; x <= x1; x += 22) line.push([x, z0 + (Math.floor((x - x0) / 22) % 2 ? 9 : -9) + fbm(x * 0.01, z0) * 20]); TRENCH.push(line);
  }
  const FORT_Z = 30;        // the broken fortress line between the two trench systems
  const gridC = new Map();
  for (const c of CRATERS) { const k = Math.floor(c[0] / 40) + ',' + Math.floor(c[1] / 40); (gridC.get(k) || gridC.set(k, []).get(k)).push(c); }
  function trenchD(x, z) {
    let best = 1e9;
    for (const line of TRENCH) { if (Math.abs(z - line[0][1]) > 60) continue;
      for (let i = 0; i < line.length - 1; i++) { const [ax, az] = line[i], [bx, bz] = line[i + 1]; if (x < Math.min(ax, bx) - 8 || x > Math.max(ax, bx) + 8) continue;
        const dx = bx - ax, dz = bz - az, t = clamp(((x - ax) * dx + (z - az) * dz) / (dx * dx + dz * dz), 0, 1), d = Math.hypot(x - ax - dx * t, z - az - dz * t); if (d < best) best = d; } }
    return best;
  }
  // the hive city: a street grid, blocks either standing, gutted or collapsed into rubble
  const BLOCKS = [];
  seed = 21;
  for (let gx = -6; gx <= 6; gx++) for (let gz = -10; gz <= -3; gz++) {
    const cx = gx * 58 + rr(-6, 6), cz = gz * 62 + rr(-6, 6); if (Math.abs(cx - 0) < 34 && cz > -560) continue;       // the main avenue the road follows
    if (rnd() < 0.18) continue;
    const w = rr(24, 40), d = rr(24, 42), state = rnd(); BLOCKS.push({ x: cx, z: cz, w, d, h: state < 0.25 ? rr(6, 14) : rr(26, 70), state: state < 0.25 ? 'rubble' : state < 0.6 ? 'gutted' : 'standing', ry: rr(-0.05, 0.05) });
  }
  function cityF(x, z) { let k = 0; for (const b of BLOCKS) { const dx = Math.abs(x - b.x) - b.w / 2 - 6, dz = Math.abs(z - b.z) - b.d / 2 - 6; if (dx < 0 && dz < 0) return 1; k = Math.max(k, 1 - Math.max(dx, dz) / 10); } return clamp(k, 0, 1); }

  // the ground height: each zone has its own shape, blended; then roads are levelled, trenches dug and craters punched
  function hShrine(x, z) {
    const hills = fbm(x * 0.0024, z * 0.0024) * 62 + Math.max(0, ridged(x * 0.003 + 4, z * 0.003) - 0.58) * 150 + fbm(x * 0.018, z * 0.018) * 2.2;
    const hub = Math.max(0, 1 - Math.hypot(x - HUB.x, z - HUB.z) / 150);
    return lerp(hills, 46, sstep(0, 0.55, hub)) + 12;
  }
  const hSiege = (x, z) => fbm(x * 0.0022, z * 0.0022) * 14 + fbm(x * 0.03, z * 0.03) * 1.0 + 16;
  const hHive = (x, z) => { const dunes = Math.sin((x * 0.5 + z) * 0.04 + fbm(x * 0.004, z * 0.004) * 3) * 2.6 * (0.6 + 0.4 * fbm(x * 0.01, z * 0.01));
    return fbm(x * 0.002 + 3, z * 0.002) * 20 + dunes * (1 - cityF(x, z) * 0.8) + 20; };
  function baseH(x, z) { const [s, f, h] = zones(x, z); return (s ? s * hShrine(x, z) : 0) + (f ? f * hSiege(x, z) : 0) + (h ? h * hHive(x, z) : 0); }
  function smoothH(x, z) { let s = 0; for (const [ox, oz] of [[0, 0], [12, 0], [-12, 0], [0, 12], [0, -12]]) s += baseH(x + ox, z + oz); return s / 5; }
  function H(x, z) {
    let y = baseH(x, z);
    const [, f, hv] = zones(x, z), rd = roadD(x, z);
    if (rd < 16) y = lerp(y, smoothH(x, z), sstep(16, 6, rd));
    const fz = f + hv * 0.4;
    if (fz > 0.05) {
      const k = Math.floor(x / 40), m = Math.floor(z / 40);
      for (let a = k - 1; a <= k + 1; a++) for (let b = m - 1; b <= m + 1; b++) { const L = gridC.get(a + ',' + b); if (!L) continue;
        for (const c of L) { const d2 = (x - c[0]) ** 2 + (z - c[1]) ** 2, r2 = c[2] * c[2]; if (d2 > r2 * 2.6) continue; const q = d2 / r2;
          y += fz * (q < 1 ? -(1 - q) * c[2] * 0.42 : Math.max(0, 1 - Math.abs(q - 1.25) * 1.8) * c[2] * 0.1) * (rd < 10 ? 0.15 : 1); } }
      const td = trenchD(x, z); if (td < 4.5) y -= f * (1 - sstep(1.6, 3.6, td)) * 2.6 - f * Math.max(0, 1 - Math.abs(td - 3.6) / 1.2) * 0.55;
    }
    return y;
  }
  const WATER_Y = 6.5;      // the shrine lake and the flooded low ground of the front

  lap('heights-fns');
  // ================================================================ renderer, sky, light
  const canvas = $('c'), renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75)); renderer.outputEncoding = THREE.sRGBEncoding; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(62, 1, 0.25, 4000);
  scene.fog = new THREE.FogExp2(0x000000, 0.0022);
  const SUN = V(-0.55, 0.22, -0.8).normalize();
  const skyU = { top: { value: CL(0x34405a) }, hor: { value: CL(0xd09868) }, low: { value: CL(0x5a4a40) }, sunCol: { value: CL(0xffb070) }, sun: { value: SUN }, time: { value: 0 } };
  const sky = new THREE.Mesh(new THREE.SphereGeometry(3000, 40, 20), new THREE.ShaderMaterial({ uniforms: skyU, side: THREE.BackSide, depthWrite: false, fog: false,
    vertexShader: 'varying vec3 vd; void main(){ vd = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: `uniform vec3 top, hor, low, sunCol, sun; uniform float time; varying vec3 vd;
      float h(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      float n(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f); return mix(mix(h(i), h(i + vec2(1,0)), f.x), mix(h(i + vec2(0,1)), h(i + vec2(1,1)), f.x), f.y); }
      float fb(vec2 p){ float s = 0.0, a = 0.5; for (int i = 0; i < 5; i++){ s += a * n(p); p *= 2.07; a *= 0.5; } return s; }
      void main(){
        float y = vd.y; vec3 c = y > 0.0 ? mix(hor, top, pow(min(1.0, y * 1.5), 0.55)) : mix(hor, low, min(1.0, -y * 5.0));
        float s = max(0.0, dot(vd, sun)); c += sunCol * (pow(s, 900.0) * 4.0 + pow(s, 14.0) * 0.4 + pow(s, 3.0) * 0.12);
        if (y > 0.0) {         // a deck of torn cloud, lit from below on the sun side
          vec2 p = vd.xz / (y + 0.12) * 1.4 + vec2(time * 0.004, time * 0.0015);
          float cl = smoothstep(0.48, 0.78, fb(p)) * smoothstep(0.0, 0.25, y);
          vec3 cc = mix(vec3(0.16, 0.13, 0.14), sunCol * 0.9 + vec3(0.12), pow(s, 4.0) * 0.8 + 0.1);
          c = mix(c, cc, cl * 0.75);
        }
        gl_FragColor = vec4(c, 1.0); }` }));
  scene.add(sky);
  const hemi = new THREE.HemisphereLight(CL(0xb8b4c8), CL(0x3a3028), 0.85);
  const sunL = new THREE.DirectionalLight(0xffc89a, 1.7);
  sunL.castShadow = true; sunL.shadow.mapSize.set(2048, 2048); Object.assign(sunL.shadow.camera, { left: -90, right: 90, top: 90, bottom: -90, near: 10, far: 700 });
  sunL.shadow.bias = -0.0006; sunL.shadow.normalBias = 0.6;
  scene.add(hemi, sunL, sunL.target);

  // ================================================================ painted ground textures (canvas), tiling
  function canvasTex(w, h, draw, rep = true) {
    const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
    const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 8; if (rep) t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
  }
  const speck = (g, w, h, n, cols, r0, r1, a0 = 0.2, a1 = 0.7) => { for (let i = 0; i < n; i++) { g.globalAlpha = rr(a0, a1); g.fillStyle = cols[Math.floor(rnd() * cols.length)]; g.beginPath(); g.ellipse(rnd() * w, rnd() * h, rr(r0, r1), rr(r0, r1) * rr(0.5, 1), rnd() * 3, 0, 7); g.fill(); } g.globalAlpha = 1; };
  // wrap-around drawing so the edges tile: draw each mark 9 times with offsets
  const wrap = (g, w, h, f) => { for (const ox of [-w, 0, w]) for (const oy of [-h, 0, h]) { g.save(); g.translate(ox, oy); f(); g.restore(); } };
  // ================================================================ scanned CC0 textures (Poly Haven, ambientCG), inlined at build time
  // kept linear: the custom shaders below decode the colour maps themselves, the same way for every material
  const TX = {};
  await Promise.all(Object.entries(ASSETS.tex).map(([k, src]) => new Promise(res => { const im = new Image(); im.onload = im.onerror = () => {
    const [n, kind] = k.split('|'), t = new THREE.Texture(im); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy()); t.needsUpdate = true;
    (TX[n] = TX[n] || { mean: new THREE.Vector3(...ASSETS.mean[n]) })[kind] = t; res(); }; im.src = src; })));
  seed = 99;
  const TEX = {
    macro: canvasTex(256, 256, (g, w, h) => { const id = g.createImageData(w, h); for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { const v = (fbm(x / 32, y / 32, 4) * 0.5 + 0.5) * 255; const i = (y * w + x) * 4; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; } g.putImageData(id, 0, 0); }),
  };
  TEX.macro.encoding = THREE.LinearEncoding;

  lap('textures');
  // ================================================================ terrain mesh, with per-vertex blend weights painted from zone, slope, road, craters
  const SEG = 400;
  const geo = new THREE.PlaneGeometry(SIZE, SIZE, SEG, SEG); geo.rotateX(-PI / 2);
  const pa = geo.attributes.position, nV = pa.count;
  for (let i = 0; i < nV; i++) pa.setY(i, H(pa.getX(i), pa.getZ(i)));
  geo.computeVertexNormals();
  const splat = new Float32Array(nV * 4), splat2 = new Float32Array(nV * 2);
  for (let i = 0; i < nV; i++) {
    const x = pa.getX(i), z = pa.getZ(i), y = pa.getY(i), slope = 1 - geo.attributes.normal.getY(i);
    const [s, f, h] = zones(x, z), rd = roadD(x, z), n = fbm(x * 0.02, z * 0.02);
    let wg = s * (1 - sstep(0.12, 0.3, slope)), wr = sstep(0.14, 0.34, slope) * (0.6 + 0.4 * s), wa = h * (1 - sstep(0.2, 0.4, slope)), wm = f * (1 - sstep(0.25, 0.45, slope));
    wm += s * sstep(0.3, 0.6, n) * 0.4;                       // muddy patches in the fields
    wg += f * sstep(0.2, 0.55, n) * 0.6;                       // dead grass struggling through the front
    if (y < WATER_Y + 1.2) { wm += 0.8; wg *= 0.4; }           // shoreline mud
    const road = sstep(6.5, 4.0, rd + n * 2.5) * (1 - h * 0.35);
    const t = wg + wr + wa + wm + 1e-4; splat.set([wg / t, wr / t, wa / t, wm / t], i * 4); splat2[i * 2] = road;
    splat2[i * 2 + 1] = clamp(f * 1.3 + h + s * sstep(0.25, 0.55, fbm(x * 0.008 + 5, z * 0.008)) * 0.5, 0, 1);      // dead grass on the front and in dry patches
  }
  geo.setAttribute('splat', new THREE.BufferAttribute(splat, 4)); geo.setAttribute('splat2', new THREE.BufferAttribute(splat2, 2));
  const terrainM = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.95, metalness: 0 });
  // grass (leafy, withered), cliff, hive concrete rubble, mud and the flagstone road, each with its normal map; 13 samplers plus the shadow map
  terrainM.onBeforeCompile = sh => {
    const L = { tG: 'leafy_grass', tW: 'withered_grass', tR: 'cliff_side', tA: 'concrete_debris', tM: 'brown_mud_02', tD: 'monastery_stone_floor' };
    for (const [k, n] of Object.entries(L)) { sh.uniforms[k] = { value: TX[n].d }; sh.uniforms['n' + k[1]] = { value: TX[n].n }; }
    sh.uniforms.tN = { value: TEX.macro };
    sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nattribute vec4 splat; attribute vec2 splat2; varying vec4 vSp; varying vec2 vRd; varying vec3 vWP, vWN;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\nvSp = splat; vRd = splat2; vWP = (modelMatrix * vec4(position, 1.0)).xyz; vWN = normal;');
    sh.fragmentShader = sh.fragmentShader.replace('#include <common>', `#include <common>
      uniform sampler2D tG, tW, tR, tA, tM, tD, nG, nW, nR, nA, nM, nD, tN; varying vec4 vSp; varying vec2 vRd; varying vec3 vWP, vWN;
      vec3 two(sampler2D t, vec2 p){ return mix(texture2D(t, p * 0.42).rgb, texture2D(t, p * 0.07).rgb, 0.3); }
      vec3 nrm(sampler2D t, vec2 p){ return texture2D(t, p * 0.42).xyz * 2.0 - 1.0; }
      // the scans pulled toward the region's palette: greener grass, olive straw, grey stone instead of sandstone, darker ash
      vec3 tone(vec3 c, float sat, vec3 tint){ return mix(vec3(dot(c, vec3(0.3, 0.59, 0.11))), c, sat) * tint; }`)
      .replace('#include <map_fragment>', `
